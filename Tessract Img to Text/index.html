<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Img To Text</title>
    <script src="script.js" defer></script>
    <link rel="icon" type="image/x-icon" href="https://i.ibb.co/Z18rH0gy/icon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

    <img src="https://i.ibb.co/xtyHbCQM/img2txt.png" id="img2txt" border="0">
    <div id="box-container">
    <div id="container">

    <input type="file" id="image-input" accept="image/*">

    <textarea id="output">
Text will appear here.  
    </textarea>
    </div>
    <div id="container">

        <button id="save-btn" onclick="copyText()"> 
            <i class="fi fi-br-copy-alt"></i>
        </button>
        <button id="download">
            <i class="fi fi-br-download"></i>
        </button>
    </div>
</div>
